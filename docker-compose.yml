version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: diaspora-postgres
    environment:
      POSTGRES_DB: diaspora_dev
      POSTGRES_USER: diaspora_user
      POSTGRES_PASSWORD: diaspora_pass_2025
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - diaspora-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diaspora_user -d diaspora_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: diaspora-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - diaspora-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: diaspora-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://diaspora_user:diaspora_pass_2025@postgres:5432/diaspora_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 7d
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:cached
      - ./backend/prisma:/app/prisma:cached
    networks:
      - diaspora-network

  # Frontend Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: diaspora-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000/api
      VITE_APP_NAME: Diaspora Platform
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - diaspora-network
    command: npm run dev -- --host

  # PgAdmin (optional, for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: diaspora-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@diaspora.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - diaspora-network
    profiles:
      - tools

networks:
  diaspora-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
